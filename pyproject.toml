[project]
name = "iching-bagua-agent"
version = "0.1.0"
description = "易经八卦映射智能体：基于语义关联的卦爻辞解释与检索"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
load-bagua = "iching_bagua.cli:load_main"
validate-bagua = "iching_bagua.cli:validate_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iching_bagua"]
